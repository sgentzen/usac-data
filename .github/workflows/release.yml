name: Release

# Publishing is deliberate: this runs only when a GitHub Release is published,
# not on tag push. Creating and pushing a tag alone does nothing.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The release tag, pyproject.toml and __init__.py must all agree. These
      # have drifted before (__version__ sat at 0.1.2 while pyproject.toml was
      # already 0.1.4), and a mismatch here would ship a wheel whose reported
      # version does not match the tag it was built from. Unrecoverable once
      # uploaded: PyPI does not allow re-uploading a version.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          dunder=$(python -c 'import re, pathlib; print(re.search(r"^__version__ = \"([^\"]+)\"", pathlib.Path("src/usac_data/__init__.py").read_text(), re.M).group(1))')
          echo "tag=$tag  pyproject.toml=$pyproject  __version__=$dunder"
          if [ "$tag" != "$pyproject" ] || [ "$tag" != "$dunder" ]; then
            echo "::error::Version mismatch — tag=$tag pyproject.toml=$pyproject __version__=$dunder"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # packaging>=24.2 is required, not incidental: this project sets
      # `license = "Apache-2.0"` (PEP 639), so hatchling emits Metadata 2.4
      # with License-Expression/License-File. Older packaging rejects those
      # fields and twine check fails with InvalidDistribution even though the
      # distribution is valid.
      - name: Check package metadata
        run: |
          python -m pip install --upgrade twine "packaging>=24.2"
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Requires a "pypi" environment on the repo. Add required reviewers there
    # if you want a manual approval gate before anything reaches PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/usac-data

    # Trusted Publishing: the OIDC token is exchanged for a short-lived upload
    # token. No PyPI API token is stored in this repository.
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
