name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Empty, so a job added later without its own `permissions:` block inherits
# nothing rather than the repository default token scope. Each job grants
# itself exactly what it needs.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      # --locked fails rather than silently re-resolving, so CI installs the
      # exact versions recorded in uv.lock. Regenerate the lock with `uv lock`
      # whenever pyproject.toml dependencies change.
      - name: Install dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

      # --no-sync: the step above already installed the locked set, so these
      # run against it rather than re-resolving.
      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check
        run: uv run --no-sync mypy src/

      - name: Test
        run: uv run --no-sync pytest
