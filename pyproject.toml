[build-system]
# Bounded deliberately: uv.lock does not cover build-system requirements, so
# without a bound the backend is resolved fresh from PyPI at release time and a
# bad hatchling release can break a publish that nothing else would catch.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "usac-data"
version = "0.3.1"
description = "Python client for USAC E-Rate Open Data (Socrata SODA API)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Scott Gentzen" },
]
keywords = ["usac", "e-rate", "soda", "socrata", "open-data", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Runtime floors are compatibility claims, not "latest": raising one shuts
    # downstream applications out for no gain. The client uses only Client,
    # AsyncClient, HTTPStatusError and TransportError, all present in 0.27, so
    # the floor stays there. uv.lock pins 0.28.x for what CI actually tests.
    "httpx>=0.27",
    # 8.3 is the floor: earlier releases bind asyncio.sleep as a default
    # argument, which the retry timing tests cannot intercept.
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-httpx>=0.35",
    "ruff>=0.16",
    "mypy>=2.0",
]

[project.urls]
Homepage = "https://github.com/sgentzen/usac-data"
Issues = "https://github.com/sgentzen/usac-data/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/usac_data"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
